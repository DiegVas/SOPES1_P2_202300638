version: "3.8"

services:
  # Zookeeper para Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - app-network

  # Kafka Broker
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - app-network

  # Deployment 2: gRPC Server 1 (Writer a Kafka)
  grpc-server-1:
    build:
      context: ./grpc-server
      dockerfile: Dockerfile
    container_name: grpc-server-1
    ports:
      - "50051:50051"
    environment:
      - GRPC_PORT=50051
      - SERVER_ID=grpc-server-1
      - KAFKA_BROKER=kafka:29092
      - KAFKA_TOPIC=ventas
    depends_on:
      - kafka
    networks:
      - app-network

  # Deployment 3: gRPC Server 2 (Writer a Kafka)
  grpc-server-2:
    build:
      context: ./grpc-server
      dockerfile: Dockerfile
    container_name: grpc-server-2
    ports:
      - "50052:50051"
    environment:
      - GRPC_PORT=50051
      - SERVER_ID=grpc-server-2
      - KAFKA_BROKER=kafka:29092
      - KAFKA_TOPIC=ventas
    depends_on:
      - kafka
    networks:
      - app-network

  # Deployment 1: Go API REST + gRPC Client
  go-api-rest:
    build:
      context: ./go-api-rest
      dockerfile: Dockerfile
    container_name: go-api-rest
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - GRPC_SERVERS=grpc-server-1:50051,grpc-server-2:50051
    depends_on:
      - grpc-server-1
      - grpc-server-2
    networks:
      - app-network

  # API REST Rust
  api-rust:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: api-rust
    # Puerto interno no expuesto directamente, solo accesible via nginx
    environment:
      - PORT=3000
      - GO_API_URL=http://go-api-rest:8080
    depends_on:
      - go-api-rest
    networks:
      - app-network

  # Nginx como proxy reverso para API Rust
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: nginx-proxy
    ports:
      - "3000:80"
    depends_on:
      - api-rust
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
