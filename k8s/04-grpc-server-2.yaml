# Deployment 3: gRPC Server 2 - CON 2 RÉPLICAS
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grpc-server-2
  namespace: blackfriday
  labels:
    deployment: grpc-server-2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: grpc-server
      deployment: grpc-server-2
  template:
    metadata:
      labels:
        app: grpc-server
        deployment: grpc-server-2
    spec:
      containers:
        - name: grpc-server
          image: 18.222.2.22:5000/grpc-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 50051
          env:
            - name: GRPC_PORT
              value: "50051"
            - name: SERVER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: KAFKA_BROKER
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KAFKA_BROKER
            - name: KAFKA_TOPIC
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: KAFKA_TOPIC
---
# Service para gRPC Server 2
apiVersion: v1
kind: Service
metadata:
  name: grpc-server-2-service
  namespace: blackfriday
spec:
  selector:
    app: grpc-server
    deployment: grpc-server-2
  ports:
    - port: 50051
      targetPort: 50051
  type: ClusterIP
