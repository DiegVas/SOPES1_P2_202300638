apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-rust
  namespace: blackfriday
  labels:
    app: api-rust
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-rust
  template:
    metadata:
      labels:
        app: api-rust
    spec:
      containers:
        - name: api-rust
          image: 3.129.65.122:30000/rust-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          env:
            - name: PORT
              value: "3000"
            - name: GO_API_URL
              value: "http://go-api-rest-service:8080"
            - name: KAFKA_BROKERS
              value: "kafka-service:9092"
            - name: KAFKA_TOPIC
              value: "compras"
          resources:
            requests:
              memory: "128Mi"
              cpu: "250m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /productos
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /productos
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-rust-service
  namespace: blackfriday
  labels:
    app: api-rust
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      protocol: TCP
      name: http
  selector:
    app: api-rust
