apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-api-rest
  namespace: blackfriday
  labels:
    app: go-api-rest
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-api-rest
  template:
    metadata:
      labels:
        app: go-api-rest
    spec:
      containers:
        - name: go-api-rest
          image: 3.129.65.122:30000/go-api-rest:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: PORT
              value: "8080"
            - name: GRPC_SERVERS
              value: "grpc-server-1:50051,grpc-server-2:50052"
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: go-api-rest-service
  namespace: blackfriday
  labels:
    app: go-api-rest
spec:
  selector:
    app: go-api-rest
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
