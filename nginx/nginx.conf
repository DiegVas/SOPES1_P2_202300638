events {
    worker_connections 1024;
}

http {
    # Configuración de logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Upstream de la API de Rust
    upstream api_rust_backend {
        # Balanceo de carga con round-robin por defecto
        server api-rust:3000 max_fails=3 fail_timeout=30s;
    }

    # Servidor HTTP
    server {
        listen 80;
        server_name _;

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "OK\n";
            add_header Content-Type text/plain;
        }

        # Proxy pass a la API de Rust
        location / {
            proxy_pass http://api_rust_backend;
            
            # Headers para mantener información del cliente original
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Configuración de buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
            proxy_busy_buffers_size 8k;
            
            # Timeouts específicos por ubicación
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # No redirigir automáticamente
            proxy_redirect off;
        }
    }
}
